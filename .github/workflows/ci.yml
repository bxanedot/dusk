name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install frontend dependencies
        run: npm install
      - name: Test embedded browser link handling and ad blocking
        shell: pwsh
        run: |
          node scripts/test-online-fix-navigation.cjs
          node scripts/test-online-fix-adblock.cjs
          node scripts/test-online-fix-autoselect.cjs
          node scripts/test-background-download-ui.cjs
          node scripts/test-game-source-browser.cjs
          node scripts/test-browser-copy-link.cjs
      - name: Verify main Dusk buttons are clickable in Windows Edge
        run: node scripts/test-main-window-interaction.mjs

      - name: Test native archive recognition and mirror handling
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build frontend
        run: npm run build
      - name: Check Tauri integration
        run: npm run tauri build -- --no-bundle

      - name: Smoke test packaged app startup
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/DuskLauncher.exe'
          if (-not (Test-Path $exe)) { throw "Dusk executable was not produced." }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Dusk exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
