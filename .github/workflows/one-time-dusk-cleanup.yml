name: One-time Dusk release and repository cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-dusk-cleanup.yml
  workflow_dispatch:
    inputs:
      paths_to_delete:
        description: 'Optional comma-separated repository paths to delete (files or entire folders)'
        required: false
        type: string
        default: ''
      delete_text_documents:
        description: 'Also remove all tracked .txt, .md, .mdx and .rst documents'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: one-time-dusk-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'Add one-time Dusk cleanup workflow')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete all Dusk releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          releases="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name')"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            echo "Deleting release and associated tag: $tag"
            gh release delete "$tag" --repo "$GH_REPO" --yes --cleanup-tag
          done <<< "$releases"

          refs="$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags" --jq '.[] | select(.ref | startswith("refs/tags/dusk-")) | .ref')"
          while IFS= read -r ref; do
            [[ -n "$ref" ]] || continue
            echo "Deleting remaining Dusk tag: $ref"
            gh api --method DELETE "repos/$GH_REPO/git/${ref}"
          done <<< "$refs"

          echo "Remaining releases:"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name'
          echo "Remaining Dusk tags:"
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags" --jq '.[] | select(.ref | startswith("refs/tags/dusk-")) | .ref'

      - name: Delete explicitly selected paths and optional text documents
        if: github.event_name == 'workflow_dispatch' && (inputs.paths_to_delete != '' || inputs.delete_text_documents)
        env:
          DELETE_PATHS: ${{ inputs.paths_to_delete }}
          DELETE_TEXT: ${{ inputs.delete_text_documents }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [[ "$DELETE_TEXT" == 'true' ]]; then
            mapfile -d '' -t tracked < <(git ls-files -z)
            for path in "${tracked[@]}"; do
              case "$path" in
                *.txt|*.md|*.mdx|*.rst)
                  echo "Removing text document: $path"
                  git rm -- ":(literal)$path"
                  ;;
              esac
            done
          fi

          IFS=',' read -r -a targets <<< "$DELETE_PATHS"
          for raw in "${targets[@]}"; do
            path="$(printf '%s' "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [[ -n "$path" ]] || continue
            case "$path" in
              '.'|'./'|/*|../*|*/../*|*/..|'.git'|'.git/'*|'.github/workflows/one-time-dusk-cleanup.yml')
                echo "::error::Unsafe path: $path"; exit 1 ;;
            esac
            if [[ "$path" == *'*'* || "$path" == *'?'* || "$path" == *'['* ]]; then
              echo "::error::Globs not allowed: $path"; exit 1
            fi
            if [[ -e "$path" ]]; then
              echo "Removing selected file/folder: $path"
              git rm -r -- ":(literal)$path"
            else
              echo "::warning::Path not present: $path"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m 'Remove explicitly selected Dusk repository content'
            git push origin HEAD:main
          else
            echo 'No selected repository files to remove.'
          fi
