[package]
name = "dusk"
version = "1.8.19"
description = "Dusk local-first game launcher by bxane"
authors = ["bxane"]
edition = "2021"

[lib]
name = "dusk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
fs2 = "0.4"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

tauri-plugin-updater = "=2.12.0"

reqwest = { version = "=0.13.5", features = ["blocking", "json", "query"] }

discord-rich-presence = "1.1.0"
